<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tienda de fotografía en La Plata</title>
  <meta name="description" content="Cámaras, insumos e impresiones en Fotografía Digital, La Plata. Pedido por WhatsApp.">
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500&family=Sora:wght@400;550&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main>
    <h1>Tienda</h1>
    <input id="q" placeholder="Buscar producto" aria-label="Buscar producto">
    <div class="filters">
      <button data-filter="todos">Todo</button>
      <button data-filter="camaras">Cámaras y accesorios</button>
      <button data-filter="maquinas">Impresoras y máquinas</button>
      <button data-filter="impresiones">Impresiones y fotos</button>
    </div>
    <div class="grid" id="list"></div>
  </main>
  <script src="js/data.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/main.js"></script>
  <script>
    let filter = "todos";
    const draw = () => {
      const q = document.getElementById("q").value.toLowerCase();
      document.getElementById("list").innerHTML = PRODUCTS
        .filter((item) => (filter === "todos" || item.category === filter) && item.name.toLowerCase().includes(q))
        .map(card).join("");
    };
    document.addEventListener("DOMContentLoaded", () => {
      draw();
      document.getElementById("q").addEventListener("input", draw);
      document.querySelectorAll("[data-filter]").forEach((button) => {
        button.addEventListener("click", () => { filter = button.dataset.filter; draw(); });
      });
    });
  </script>
</body>
</html>
