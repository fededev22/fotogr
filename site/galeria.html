<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Galería | Fotografía Digital La Plata</title>
  <meta name="description" content="Trabajos de fotografía en La Plata.">
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500&family=Sora:wght@400;550&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main>
    <h1>Galería</h1>
    <div class="filters" id="filters"></div>
    <div class="grid" id="list"></div>
  </main>
  <script src="js/data.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/main.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const tags = ["todas", ...new Set(GALLERY.map((photo) => photo.tag))];
      let tag = "todas";
      const draw = () => {
        document.getElementById("list").innerHTML = GALLERY
          .filter((photo) => tag === "todas" || photo.tag === tag)
          .map((photo) => `<button class="card" data-src="${photo.src}"><img src="${photo.src}" alt="${photo.alt}" loading="lazy"></button>`)
          .join("");
      };
      document.getElementById("filters").innerHTML = tags.map((item) => `<button data-tag="${item}">${item}</button>`).join("");
      document.getElementById("filters").addEventListener("click", (event) => {
        const button = event.target.closest("[data-tag]");
        if (!button) return;
        tag = button.dataset.tag;
        draw();
      });
      document.getElementById("list").addEventListener("click", (event) => {
        const button = event.target.closest("[data-src]");
        if (!button) return;
        const box = document.createElement("div");
        box.className = "lightbox";
        box.innerHTML = `<img src="${button.dataset.src}" alt="">`;
        box.addEventListener("click", () => box.remove());
        document.body.append(box);
      });
      draw();
    });
  </script>
</body>
</html>
