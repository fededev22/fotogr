<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tu pedido | Fotografía Digital</title>
  <meta name="description" content="Revisá el pedido y envialo por WhatsApp.">
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500&family=Sora:wght@400;550&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main>
    <h1>Pedido</h1>
    <div data-cart></div>
    <form id="send">
      <label>Nombre<input id="name" required></label>
      <label>Comentarios<textarea id="note" rows="3"></textarea></label>
      <button>Enviar pedido por WhatsApp</button>
    </form>
  </main>
  <script src="js/data.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/main.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById("send").addEventListener("submit", (event) => {
        event.preventDefault();
        if (!readCart().length) return;
        sendOrder(document.getElementById("name").value, document.getElementById("note").value);
      });
    });
  </script>
</body>
</html>
